[project]
name = "gossamer"
version = "0.1.0"
description = "Gossamer — weave httpx, proxies, and crawls into a local attack-surface graph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "neo4j>=5.14.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.23.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gossamer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
